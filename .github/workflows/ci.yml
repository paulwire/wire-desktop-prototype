name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build
        run: ./gradlew assemble --no-daemon

      - name: Tests
        run: ./gradlew test --no-daemon

      - name: Coverage check
        run: ./gradlew koverVerify --no-daemon

      - name: Detekt
        run: ./gradlew detekt --no-daemon

      - name: Konsist architecture checks
        run: ./gradlew konsistTest --no-daemon
