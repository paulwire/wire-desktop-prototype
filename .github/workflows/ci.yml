name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wire-desktop-prototype
    steps:
      # Checked out into a subdirectory, as a sibling of kalium below — actions/checkout's `path`
      # can't point outside $GITHUB_WORKSPACE with `../`, so both repos live under the workspace
      # root instead, giving them the same sibling relationship `../kalium` expects locally.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: wire-desktop-prototype

      - name: Checkout kalium and set up JDK
        uses: ./wire-desktop-prototype/.github/actions/checkout-kalium

      # Project-scoped (":assemble", not "assemble"): a bare task name has, at least once, pulled
      # kalium's unrelated and broken :monkeys module into the build (ADR 0002/0003 — the exact
      # trigger wasn't pinned down, so scoping is a precaution, not a confirmed fix).
      - name: Build
        run: ./gradlew :assemble --no-daemon

      - name: Tests
        run: ./gradlew :test --no-daemon

      - name: Coverage check
        run: ./gradlew :koverVerify --no-daemon

      - name: Detekt
        run: ./gradlew :detekt --no-daemon

      - name: Konsist architecture checks
        run: ./gradlew :konsistTest --no-daemon
